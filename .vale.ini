StylesPath = docs/styles

MinAlertLevel = suggestion

Vocab = Base,icalendar

Packages = Microsoft

[*]
BasedOnStyles = Vale, Microsoft, icalendar
Microsoft.Contractions = suggestion
Microsoft.GeneralURL = NO
# Override Microsoft.Quotes to allow a single letter in quotes followed by punctuation.
# docs/styles/icalendar/Quotes.yml
Microsoft.Quotes = NO
Microsoft.Units = suggestion

# Ignore Sphinx Python object roles, such as ":class:" and ":meth:",
# to prevent false positives from Microsoft.Spacing on dotted Python names.
TokenIgnores = :[a-z]+:\x60.+\x60
