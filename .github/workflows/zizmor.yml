name: zizmor static analysis

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  zizmor:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Update pip
        run: scripts/update-pip.sh
      - name: Install zizmor
        # 1.32.0 is the first release that reads the actions lockfile
        run: pip install zizmor==1.32.0  # also update pyproject.toml
      - name: Run zizmor
        run: zizmor --format sarif .github/workflows/ > zizmor-results.sarif
      - name: Upload SARIF file
        # https://github.com/github/codeql-action/releases
        uses: github/codeql-action/upload-sarif@v4.39.3
        with:
          sarif_file: zizmor-results.sarif

  # Fails when .github/workflows/actions.lock is out of sync with the
  # workflows or a locked pin no longer verifies upstream.
  # https://docs.github.com/en/actions/how-tos/administer/enforce-workflow-lockfiles
  lockfile:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Verify the actions lockfile
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh extension install github/gh-actions-lock --pin v0.4.1
          gh actions-lock --verify
